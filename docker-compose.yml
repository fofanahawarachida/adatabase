services:
  # ----------------------------------------------------
  # Conteneur PHP + Apache
  # ----------------------------------------------------
  php:
    container_name: php_container
    build: ./php
    ports:
      - "8080:80"
    volumes:
      - ./www:/var/www/html
    depends_on:
      - mysql
    networks:
      - my_network

  # ----------------------------------------------------
  # Conteneur MySQL
  # ----------------------------------------------------
  mysql:
    container_name: mysql_container
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mydatabase
      MYSQL_USER: admin
      MYSQL_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - my_network

  # ----------------------------------------------------
  # Conteneur phpMyAdmin
  # ----------------------------------------------------
  phpmyadmin:
    container_name: phpmyadmin_container
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - mysql
    networks:
      - my_network

  # ----------------------------------------------------
  # Conteneur PostgreSQL
  # ----------------------------------------------------
  postgres:
    container_name: postgres_container
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - my_network

  # ----------------------------------------------------
  # Conteneur pgAdmin
  # ----------------------------------------------------
  pgadmin:
    container_name: pgadmin_container
    image: dpage/pgadmin4:latest
    restart: always
    ports:
      - "8082:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.fr
      PGADMIN_DEFAULT_PASSWORD: root
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - my_network

# ------------------------------------------------------
# Réseau partagé entre les conteneurs
# ------------------------------------------------------
networks:
  my_network:

# ------------------------------------------------------
# Volumes persistants
# ------------------------------------------------------
volumes:
  mysql_data:
  postgres_data:
  pgadmin_data: